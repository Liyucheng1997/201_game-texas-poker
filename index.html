<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-version" content="2.2.0">
<title>棋牌大厅 · 德州 / 斗地主 / 斗牛 / 掼蛋 / 吹牛</title>
<link rel="stylesheet" href="css/common.css?v=2.2.0">
<link rel="stylesheet" href="css/lobby.css?v=2.2.0">
</head>
<body>
<div id="lobby">
  <header class="lb-head">
    <div class="lb-logo">🎴 棋牌大厅</div>
    <div class="lb-sub">德州扑克 · 斗地主 · 斗牛 · 掼蛋 · 吹牛 —— 纯单机，和性格各异的 AI 过招</div>
    <div class="lb-stars" id="lb-stars"></div>
  </header>

  <nav class="lb-tabs">
    <button class="lb-tab" data-tab="free">🎮 自由对局</button>
    <button class="lb-tab" data-tab="campaign">🗺️ 闯关模式</button>
  </nav>

  <section class="lb-pane" id="pane-free">
    <h2 class="lb-h2">选择难度</h2>
    <div class="lb-diffs" id="lb-diffs"></div>
    <h2 class="lb-h2">选择游戏</h2>
    <div class="lb-games" id="lb-games"></div>
  </section>

  <section class="lb-pane" id="pane-campaign">
    <p class="lb-tip">20 个关卡分四章，难度逐级提升，部分关卡带有特殊规则。过关即可解锁下一关，满足额外条件可拿满 ⭐⭐⭐。</p>
    <div id="lb-chapters"></div>
    <div class="lb-reset"><button class="hub-btn gray" id="lb-reset">重置闯关进度</button></div>
  </section>
</div>

<script src="js/common.js?v=2.2.0"></script>
<script src="js/lobby.js?v=2.2.0"></script>
</body>
</html>
